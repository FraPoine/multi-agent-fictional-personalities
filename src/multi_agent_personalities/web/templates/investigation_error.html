<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div class="brand-block"><p class="brand-name">{{ page_title }}</p></div>
            <div class="header-actions">
                <nav class="app-nav" aria-label="Primary navigation">
                    <a href="{{ url_for('home') }}">Conversations</a>
                    <a href="{{ url_for('investigations_index') }}" aria-current="page">Investigations</a>
                </nav>
                <span class="provider-badge">local {{ provider_name }}</span>
            </div>
        </div>
    </header>
    <main class="investigation-detail-workspace">
        <section class="panel">
            <div class="panel-body transcript-error" role="alert">
                <span class="transcript-error-mark" aria-hidden="true">!</span>
                <h1>{{ heading }}</h1>
                <p>{{ message }}</p>
                <p><a href="{{ url_for('investigations_index') }}">Return to investigations</a></p>
            </div>
        </section>
    </main>
</body>
</html>
