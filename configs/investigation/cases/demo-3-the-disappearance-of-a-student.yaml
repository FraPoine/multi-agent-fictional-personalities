case_id: demo-3-the-disappearance-of-a-student
title: The Disappearance of a Student
short_description: Arkham police officers have until the end of the day to find a university student missing for three weeks.
opening: 'It''s 6 a.m. on a rainy Friday morning, and as officers of the Arkham City

  Police Department, that means your shift starts now. You don''t expect anything

  exciting from the day ahead. You find the same-old piles of paperwork on your

  desks, and body odors still flow from the drunk tank. Before too long, Chief

  Burt calls you into his office. Hoping that a new case will put some distance

  between you and your paperwork, you hurry to the meeting.


  "Professor Bradshaw of Miskatonic University (1300) came to see me last night.

  He wanted to report the disappearance of a diligent student of his, Albert

  Copper. He''s been missing for the past three weeks. The professor stopped by

  Mrs. Charline''s boarding house (1900), where Albert rents a room. But he wasn''t

  there. I figure he''s probably shacked up with some broad somewhere. But still,

  I promised him we''d look into it. And by we, I mean you. You have until tonight

  to find this guy. Got it?"'
