case_id: demo-2-an-irregular-meeting
title: An Irregular Meeting
short_description: Wiggins tests the newly formed Irregulars with a suspicious plan taking shape around Trafalgar Square.
opening: 'The streets of London are a harsh place for young children. With no parents to

  care for us, we''ve been left to scrape a living in various ways - begging,

  chimney-sweeping, or selling goods on the street. And amongst the hardship, we

  have formed some strong friendships. We met Wiggins a month ago. A confident

  and witty 7-year old (a year older than most of us), we have already begun to

  see him as our natural leader. Early one Saturday morning, he gathers us

  together.


  "Last week," he tells us, "I became acquainted with a distinguished gentleman,

  a ''consulting detective'' so he calls his self, who goes by the name of Mr

  Sherlock Holmes. I helped him in a little matter, and he was flush with praise.

  Now, he''s asked me to form a gang of plucky and sharp-witted folk, what will be

  like an unofficial police force, at his disposal."


  "So we''d help solve crimes?" asks Tinker, the youngest of us.


  "That''s it," replies Wiggins, and we begin to chatter excitedly.


  "And," he continues, raising his voice to be heard, "in return, we garner a

  shilling per day, and a guinea for a vital clue! But first, there is a test."


  "A test?" exclaims Simpson, a stocky, red-haired boy. "Like at school?"


  We burst into raucous laughter.


  "No," replies Wiggins, grinning. "Not a jot like school. Mr Holmes needs to

  know we''re up to the work. You''ve heard of Gilly the Ghost?"


  We nod. Gilly the Ghost - real name Gilly Niles - is one of the most notorious

  thieves of the West End. An expert in disguise, she can change her appearance

  in seconds, making any pursuers think she''s vanished into the air. Once,

  disguised as a male doorman, she made away with a hotel guest''s entire set of

  luggage. She also worked as an actress, until she was caught stealing from the

  theatre and spent seven months in Millbank Prison. Some of us know her by

  sight: she is in her twenties, has brown hair and seems constantly on the

  alert.


  "Gilly''s been seen around Trafalgar Square a lot of late," Wiggins continues,

  "Mr Holmes believes she has some kind of skulduggery in mind. He''s given us two

  tasks. First, we must find out what she''s planning. Second, we must try to stop

  her plan going ahead. So lads, do you want to be detectives?"


  Our response is an enthusiastic roar.


  "Well then, let''s show Mr Holmes what we''re made of!"'
